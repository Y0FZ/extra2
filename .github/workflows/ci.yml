name: CI Pipeline

# Ejercicio 1: Pipeline de Integracion Continua
# Se dispara en push a main y develop, y en pull requests hacia main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Publish notification to job summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### :white_check_mark: CI exitoso" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :x: CI fallo" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Rama: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Disparado por: ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

      # Notificacion opcional a Slack/Discord. Se activa solo si el
      # secreto SLACK_WEBHOOK_URL fue configurado en el repositorio
      # (Settings > Secrets and variables > Actions). Si no existe,
      # este paso se omite sin hacer fallar el pipeline.
      - name: Notify Slack (optional)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CI Pipeline (${{ github.repository }}) finalizo con estado: ${STATUS}\"}" \
            "$SLACK_WEBHOOK_URL"
